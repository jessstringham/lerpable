[package]
name = "lerpable"
version = "0.0.2"
edition = "2021"
authors = ["Jessica Stringham <jessica@thisxorthat.art>"]
repository = "https://github.com/jessstringham/lerpable.git"
description = "a derive macro for combining ADTs"
license = "MIT"

[features]
default = []
glam = ["dep:glam"]

[dependencies]
lerpable_derive = { version = "0.0.2", path = "../lerpable_derive/" }

glam = { version = "0.28.0", features = ["serde"], optional = true }
